# Release bei einem Versions-Tag (v1.2.3): Server-Image auf ghcr.io, signierte App, ESP-Firmware als GitHub-Release.
# App-Signatur aus den Secrets REKSIO_KEYSTORE (PKCS12, base64) und REKSIO_KEYSTORE_PASSWORD; fehlen sie, gibt es
# keine APK im Release (ein anderer Schlüssel ließe sich nicht über die installierte App legen).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Signierschlüssel
        id: key
        env:
          KEYSTORE: ${{ secrets.REKSIO_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "Kein REKSIO_KEYSTORE: keine APK"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KEYSTORE" | base64 -d > reksio.keystore
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Bauen
        if: steps.key.outputs.ok == 'true'
        env:
          REKSIO_KEYSTOREPASSWORD: ${{ secrets.REKSIO_KEYSTORE_PASSWORD }}
        run: |
          v="${GITHUB_REF_NAME#v}"; base="${v%%-*}"
          IFS=. read -r major minor patch <<< "$base"
          export REKSIO_VERSIONNAME="$v" REKSIO_VERSIONCODE=$((major * 10000 + minor * 100 + patch))
          ./gradlew --no-daemon -q testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "reksio-$v.apk"
      - if: steps.key.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/reksio-*.apk

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reksio-pio -f esp/Dockerfile.build esp
      - run: |
          docker run --rm -e FIRMWARE_VERSION="${GITHUB_REF_NAME#v}-reksio-headless" -v "$PWD/esp:/src" reksio-pio pio run -e esp32-headless
          cp esp/.pio/build/esp32-headless/firmware.bin "reksio-esp32-headless-${GITHUB_REF_NAME#v}.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: reksio-esp32-headless-*.bin

  release:
    needs: [image, apk, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):$v"
          sed "s#ghcr.io/volp02/reksio:latest#$image#" docs/compose.example.yaml > out/compose.yaml
          # Abschnitt der Version aus CHANGELOG.md
          awk -v v="$v" 'index($0, "## " v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          { echo; echo "Server-Image: \`$image\`"; } >> notes.md
          pre=""; case "$v" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" out/* $pre --title "Reksio $v" --notes-file notes.md
