# Reksio server (Vacuula + Reksio web app) from the ready-made image.
#   docker compose up -d   ->   http://<host>:8050
# network_mode host: the robot finds the server via mDNS, and the Gen3 port (335) must be reachable directly.
services:
  reksio:
    image: ghcr.io/volp02/reksio:latest
    network_mode: host
    environment:
      - TZ=Europe/Berlin
      - VACUULA_PORT=8050
      - GEN3_ENABLED=True
      - GEN3_PORT=335
      - GEN4_ENABLED=True
      - GEN4_PORT=3443
      - MDNS_ENABLED=True
      # LAN IP of this host (for mDNS and the certificate)
      - HOST_IP=192.168.1.10
      # optional: ESP32 on the robot (OpenNeato) for telemetry, position and battery diagnostics
      # - ESP_HOST=192.168.1.20
    volumes:
      - reksio-data:/server/data
    restart: unless-stopped

volumes:
  reksio-data:
